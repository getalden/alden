<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alden</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        font: 14px/1.45 system-ui, sans-serif;
        background: #f4faf9;
        color: #33484b;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #081014; color: #a9c2c0; }
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .ring {
        width: 32px; height: 32px; border-radius: 50%;
        border: 3px solid rgba(20, 184, 166, .25); border-top-color: #14b8a6;
        animation: spin 1s linear infinite;
      }
      /* The title bar is the page (titleBarStyle Overlay): its top 44px drags the window, as Alden's top bar does. */
      .drag { position: fixed; top: 0; left: 0; right: 0; height: 44px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div class="drag" data-tauri-drag-region></div>
    <main>
      <div class="ring" aria-hidden="true"></div>
      <p id="status">Starting Alden…</p>
    </main>
  </body>
</html>
