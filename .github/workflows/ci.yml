name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -s tsx scripts/sync-versions.ts --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The standalone binary, built and smoke-tested per push on Linux and Windows (Windows builds differently enough
  # to break on its own); the release builds all five.
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bin: dist-bin/alden-linux-x64 }
          - { os: windows-2025, bin: dist-bin/alden-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:binary
      - run: pnpm smoke:binary ${{ matrix.bin }}
