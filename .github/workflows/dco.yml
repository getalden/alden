name: DCO

# Every commit in a pull request needs a Signed-off-by line from its author (`git commit -s`), certifying the
# Developer Certificate of Origin (https://developercertificate.org). See CONTRIBUTING.md.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check each commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off each commit with 'git commit -s' (or 'git rebase --signoff $BASE' to fix these), then push again."
            exit 1
          fi
          echo "Every commit is signed off."
